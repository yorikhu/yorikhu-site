worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Docker 内置 DNS：容器重建后自动重新解析，避免旧 IP 导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP：已配置域名 301 跳转 HTTPS
    server {
        listen 80;
        server_name yorikhu.com www.yorikhu.com yorikhu.top www.yorikhu.top;
        return 301 https://$host$request_uri;
    }

    # HTTP 兜底：IP 直连或未配置域名（无证书可用，纯 HTTP）
    server {
        listen 80 default_server;
        server_name _;

        location = /api { return 308 /api/; }
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            set $upstream http://api:5000;
            proxy_pass $upstream;
        }
        location / {
            set $upstream http://web:3000;
            proxy_pass $upstream;
        }
    }

    # HTTPS：证书文件放在 nginx/certs/（见 NGINX.md）
    # 若每个域名单独一张证书，按域名拆分多个 server 块并分别指定证书
    server {
        listen 443 ssl;
        server_name yorikhu.com www.yorikhu.com yorikhu.top www.yorikhu.top;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /api { return 308 /api/; }
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            set $upstream http://api:5000;
            proxy_pass $upstream;
        }
        location / {
            set $upstream http://web:3000;
            proxy_pass $upstream;
        }
    }
}
