    <script>
      window.addEventListener("error", function (event) {
        const errorObj = {
          message: event.message,
          source: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          stack: event.error ? event.error.stack : null
        };
        window.parent.postMessage(
          { action: "error", error: JSON.stringify(errorObj) },
          "*"
        );
        event.preventDefault();
      });

  function handleImportError(error) {
    throw new Error('Import module failed: ' + error.target.src);
  }

  const observer = new MutationObserver(mutations => {
    mutations.forEach(mutation => {
      mutation.addedNodes.forEach(node => {
        if (node.tagName === 'SCRIPT' && node.type === 'module') {
          node.onerror = handleImportError;
        }
      });
    });
  });

  observer.observe(document.documentElement, { childList: true, subtree: true });

  document.querySelectorAll('script[type="module"]').forEach(script => {
    script.onerror = handleImportError;
  });

  
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});

          style={{
            transform: isHoveringTerminal 
              ? `translate(${terminalOffset.x}px, ${terminalOffset.y}px)` 
              : 'translate(0px, 0px)',
            boxShadow: isHoveringTerminal
              ? '0 20px 40px -10px rgba(0,240,255,0.15)'
              : 'none',
            borderColor: isHoveringTerminal
              ? 'rgba(0, 240, 255, 0.3)'
              : 'rgba(255, 255, 255, 0.1)'
          }}
          onMouseMove={(e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            setTerminalOffset({ x: x * 0.05, y: y * 0.05 });
          }}
          onMouseEnter={() => setIsHoveringTerminal(true)}
          onMouseLeave={() => {
            setIsHoveringTerminal(false);
            setTerminalOffset({ x: 0, y: 0 });
          }}
        >
